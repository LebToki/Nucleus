project:
  name: "Al-Marmouq For Oud"
  description: "Sovereign CRM & ERP V3 for luxury oud perfumery"
  codebase: /var/www/html/almarmouq3
  domain: almarmouqoud.com
  type: web_fullstack
  version: "3.0.0"
  locale_support: [en, ar]
  language_distribution:
    php: 45
    jsx_react: 35
    css: 15
    typescript: 5

tech_stack:
  backend:
    framework: Laravel 11
    language: PHP 8.2+
    orm: Eloquent
    database: MySQL 8.0 (DB_DATABASE=almarmouqsite)
    cache: file/redis
    queue: sync
  frontend:
    bundler: Vite 5
    styling: TailwindCSS + 2TITHEME tokens
    design_system: design-language.md + _theme/ (WowDash Bootstrap 5)
    theme_tokens:
      obsidian_base: "#0D1B2A"
      obsidian_panel: "#162235"

dependencies:
  php:
    runtime: "^8.2"
    packages:
      require:
        laravel/framework: "^11.0"
        laravel/tinker: "^2.9"
        symfony/asset: "^7.1"
        symfony/asset-mapper: "^7.1"
        backpack/basset: "*"
      require_dev:
        phpunit/phpunit: "^10.5"
        fakerphp/faker: "^1.23"
        laravel/pint: "^1.13"
        laravel/sail: "^1.26"
        mockery/mockery: "^1.6"
        nunomaduro/collision: "^8.0"
        spatie/laravel-ignition: "^2.4"
  nodejs:
    packages:
      devDependencies:
        axios: "^1.6.4"
        laravel-vite-plugin: "^1.0"
        vite: "^5.0"

environment:
  required_vars:
    - APP_KEY
    - APP_URL
    - DB_CONNECTION
    - DB_HOST
    - DB_PORT
    - DB_DATABASE
    - DB_USERNAME
    - DB_PASSWORD
    - DB_SOCKET
    - DB_COLLATION
    - CACHE_STORE
    - SESSION_DRIVER
    - SESSION_LIFETIME
    - REDIS_HOST
    - REDIS_PORT
    - MAIL_MAILER
    - MAIL_FROM_ADDRESS
    - MAIL_FROM_NAME
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_DEFAULT_REGION
    - AWS_BUCKET
    - GITEA_REPO
    - GITEA_TOKEN
  optional_vars:
    - APP_ENV
    - APP_DEBUG
    - APP_TIMEZONE
    - APP_LOCALE
    - APP_FALLBACK_LOCALE
    - APP_FAKER_LOCALE
  production_security:
    - Set APP_ENV=production
    - Set APP_DEBUG=false
    - Use unique APP_KEY
    - Set up HTTPS (APP_URL=https://almarmouqoud.com)
    - Rotate GITEA_TOKEN regularly

build_steps:
  - name: Install PHP dependencies
    command: "composer install --optimize-autoloader --no-interaction"
    order: 1
  - name: Install Node dependencies
    command: "npm ci"
    order: 2
  - name: Copy environment file
    command: "cp .env.example .env && php artisan key:generate --ansi"
    order: 3
  - name: Generate DB credentials
    command: "php artisan db:generate"
    order: 3
  - name: Run migrations
    command: "php artisan migrate --force"
    order: 4
  - name: Build assets
    command: "npm run build"
    order: 5
  - name: Cache config
    command: "php artisan config:cache"
    order: 5
  - name: Cache routes
    command: "php artisan route:cache"
    order: 6
  - name: Cache views
    command: "php artisan view:cache"
    order: 6

testing:
  framework: PHPUnit 10.5
  config_file: phpunit.xml
  test_dir: tests/
  commands:
    - "php vendor/bin/phpunit --testdox"
    - "php artisan test"
    - "php artisan test --testsuite=Feature"
    - "php artisan test --testsuite=Unit"
  coverage:
    driver: xdebug
    threshold: 85

database:
  type: mysql
  host: localhost
  port: 3306
  name: almarmouqsite
  user: almarmouq_app
  migrations_dir: database/migrations/
  migration_count: 20
  seeders_dir: database/seeders/
  factories_dir: database/factories/
  models:
    - User
    - Customer
    - Sale
    - SaleItem
    - Product
    - ProductLot
    - ProductPriceHistory
    - RawInventoryItem
    - CommunicationLog
    - Delegation
    - DelegationComment
    - DelegationStatus
    - Event
    - Translation
    - TranslationHistory

routes:
  total_routes: 193
  route_view_placeholders: 37
  modules:
