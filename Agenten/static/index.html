        /* Rendered Markdown in preview */
        .rendered-markdown h1 { font-size: 24px; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-top: 0; }
        .rendered-markdown h2 { font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 24px; }
        .rendered-markdown h3 { font-size: 15px; margin-top: 18px; }
        .rendered-markdown code { background: var(--input-bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .rendered-markdown pre { background: var(--input-bg); padding: 14px; border-radius: 8px; overflow-x: auto; }
        .rendered-markdown pre code { background: none; padding: 0; }
        .rendered-markdown ul, .rendered-markdown ol { padding-left: 24px; }
        .rendered-markdown li { margin: 4px 0; }
        .rendered-markdown table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        .rendered-markdown th, .rendered-markdown td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .rendered-markdown th { background: var(--panel-header); }
